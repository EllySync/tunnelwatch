name: Deploy TunnelWatch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/tunnelwatch' }}
            
            # Pull latest code
            git pull origin main
            
            # Rebuild and restart containers
            docker compose pull
            docker compose build --no-cache
            docker compose up -d
            
            # Wait for services to be healthy
            sleep 10
            
            # Run database migrations if any
            docker compose exec -T postgres psql -U tunnelwatch -d tunnelwatch -f /docker-entrypoint-initdb.d/init.sql 2>/dev/null || true
            
            # Health check
            curl -f http://localhost/health.php || exit 1
            
            echo "✅ Deployment successful!"
